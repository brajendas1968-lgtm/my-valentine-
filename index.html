<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>For Madam Jii 💗</title>
<style>

body{
  margin:0;
  font-family: 'Segoe UI', sans-serif;
  text-align:center;
  overflow:hidden;
  background: linear-gradient(135deg,#ff9ecf,#ffc1e3,#ffb6d9);
}

/* Floating hearts & flowers */
.floating{
  position:fixed;
  width:100%;
  height:100%;
  pointer-events:none;
  z-index:0;
}

.floating span{
  position:absolute;
  font-size:22px;
  animation: floatUp 12s linear infinite;
  opacity:0.7;
}

@keyframes floatUp{
  0%{transform:translateY(100vh);opacity:0;}
  20%{opacity:1;}
  100%{transform:translateY(-10vh);opacity:0;}
}

/* Intro Page */
#intro{
  height:100vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  z-index:2;
  position:relative;
}

button{
  padding:12px 25px;
  font-size:18px;
  border:none;
  border-radius:25px;
  cursor:pointer;
  margin:10px;
  transition:0.3s;
}

#yesBtn{
  background:#ff4da6;
  color:white;
}

#noBtn{
  background:#666;
  color:white;
}

/* Envelope Page */
#main{
  display:none;
  flex-wrap:wrap;
  justify-content:center;
  align-items:center;
  height:100vh;
  gap:20px;
  position:relative;
  z-index:2;
}

.envelope{
  width:90px;
  height:60px;
  background:#ff4da6;
  position:relative;
  cursor:pointer;
  border-radius:5px;
}

.envelope:before{
  content:"";
  position:absolute;
  top:0;
  left:0;
  width:0;
  height:0;
  border-left:45px solid transparent;
  border-right:45px solid transparent;
  border-top:30px solid #ff99cc;
}

/* Letter Screen */
#letterScreen{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  display:none;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:30px;
  background:linear-gradient(135deg,#ffb6d9,#ffcce6);
  z-index:5;
}

#letterText{
  background:rgba(255,255,255,0.5);
  padding:25px;
  border-radius:20px;
  max-width:90%;
  box-shadow:0 0 25px rgba(255,0,120,0.6);
  font-size:16px;
  line-height:1.7;
  white-space:pre-wrap;
}

.back-btn{
  margin-top:30px;
  padding:10px 20px;
  background:#ff4da6;
  color:white;
  border:none;
  border-radius:20px;
}

</style>
</head>
<body>

<div class="floating" id="floating"></div>

<!-- INTRO -->
<div id="intro">
<h2>Heyyy meriii pyaari Madam Jiii 👀💗<br>Apke liye ek surprise hai 🤭</h2>
<p>Are you ready? 😉</p>
<button id="yesBtn">YES 💗</button>
<button id="noBtn">NO 🙄</button>
</div>

<!-- ENVELOPES -->
<div id="main">
<div class="envelope" onclick="openLetter(0)"></div>
<div class="envelope" onclick="openLetter(1)"></div>
<div class="envelope" onclick="openLetter(2)"></div>
<div class="envelope" onclick="openLetter(3)"></div>
<div class="envelope" onclick="openLetter(4)"></div>
<div class="envelope" onclick="openLetter(5)"></div>
<div class="envelope" onclick="openLetter(6)"></div>
<div class="envelope" onclick="openLetter(7)"></div>
</div>

<!-- LETTER SCREEN -->
<div id="letterScreen">
<div id="letterText"></div>
<button class="back-btn" onclick="goBack()">Back 💗</button>
</div>

<script>

/* Floating animation */
const floatContainer=document.getElementById("floating");
for(let i=0;i<25;i++){
  let span=document.createElement("span");
  span.innerHTML=Math.random()>0.5?"💗":"🌷";
  span.style.left=Math.random()*100+"vw";
  span.style.animationDuration=(8+Math.random()*6)+"s";
  span.style.fontSize=(18+Math.random()*15)+"px";
  floatContainer.appendChild(span);
}

/* Yes No Logic */
let noCount=0;
const noBtn=document.getElementById("noBtn");
const yesBtn=document.getElementById("yesBtn");

noBtn.onclick=function(){
  noCount++;
  yesBtn.style.transform=`scale(${1+noCount*0.2})`;
  if(noCount>=5){
    noBtn.style.display="none";
  }
};

yesBtn.onclick=function(){
  document.getElementById("intro").style.display="none";
  document.getElementById("main").style.display="flex";
};

/* Messages */

function openLetter(index){
  document.getElementById("letterScreen").style.display="flex";
  typeWriter(letters[index]);
}

function goBack(){
  document.getElementById("letterScreen").style.display="none";
}

function typeWriter(text){
  const display=document.getElementById("letterText");
  display.innerHTML="";
  let i=0;
  function typing(){
    if(i<text.length){
      display.innerHTML+=text.charAt(i);
      i++;
      setTimeout(typing,20);
    }
  }
  typing();
}

</script>

</body>
  </html>
