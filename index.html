<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Kolizaa 💗</title>

<style>
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:linear-gradient(135deg,#ff9ecf,#ffcce6,#ffd6eb);
  overflow-x:hidden;
}

/* Floating */
.floating-container{
  position:fixed;
  width:100%;
  height:100%;
  top:0;
  left:0;
  pointer-events:none;
  overflow:hidden;
  z-index:0;
}
.float-item{
  position:absolute;
  font-size:22px;
  opacity:0;
  animation:floatUp linear forwards;
}
@keyframes floatUp{
  0%{transform:translateY(100vh);opacity:0;}
  20%{opacity:0.8;}
  100%{transform:translateY(-10vh);opacity:0;}
}

/* Intro */
.section{
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  height:100vh;
  text-align:center;
  padding:20px;
  position:relative;
  z-index:2;
}
button{
  padding:12px 25px;
  margin:10px;
  border:none;
  border-radius:25px;
  font-size:18px;
  cursor:pointer;
}
.yes{background:#ff4fa3;color:white;}
.no{background:white;color:#ff4fa3;position:absolute;}
.hidden{display:none;}

/* Envelope Grid */
.container{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  gap:20px;
  padding:30px;
  position:relative;
  z-index:2;
}
.envelope{
  height:100px;
  background:white;
  border-radius:12px;
  position:relative;
  cursor:pointer;
  box-shadow:0 10px 20px rgba(0,0,0,0.1);
  overflow:hidden;
  transition:0.3s;
}
.envelope:hover{transform:scale(1.05);}
.envelope:before{
  content:"";
  position:absolute;
  top:0;
  width:100%;
  height:50%;
  background:#ff4fa3;
  clip-path:polygon(0 0,100% 0,50% 100%);
  transition:0.6s;
}
.envelope.open:before{transform:rotateX(180deg);}
.envelope span{
  position:absolute;
  bottom:10px;
  width:100%;
  text-align:center;
  font-weight:bold;
}

/* Letter Screen */
.letter-screen{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  display:none;
  flex-direction:column;
  padding:40px 25px;
  overflow-y:auto;
  z-index:5;
  background: linear-gradient(135deg,#ffb6d9,#ff9ecf,#ffcce6);
}
#letterText{
  background: rgba(255,255,255,0.6);
  padding:25px;
  border-radius:20px;
  font-size:18px;
  line-height:1.8;
  box-shadow:0 0 25px rgba(255,0,120,0.5);
  border:2px solid rgba(255,255,255,0.6);
  white-space:pre-line;
}

.sparkle{
  position:absolute;
  font-size:14px;
  animation:sparkleAnim 2s infinite ease-in-out;
}
@keyframes sparkleAnim{
  0%{opacity:0; transform:scale(0.5);}
  50%{opacity:1; transform:scale(1);}
  100%{opacity:0; transform:scale(0.5);}
}

.back-btn{
  margin-top:20px;
  padding:10px 20px;
  background:#ff4fa3;
  color:white;
  border:none;
  border-radius:20px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="floating-container"></div>

<div class="section" id="intro">
<h2>Heyyy meriii pyaari Madam Jiii 💗<br>Apke liye ek surprise hai 🤭<br>Are you ready? 🌷</h2>
<button class="yes" onclick="showLetters()">Yes 💗</button>
<button class="no" id="noBtn">No 🙄</button>
</div>

<div class="hidden" id="lettersPage">
<div class="container">
<div class="envelope" onclick="openLetter(0,this)"><span>🌷 Rose</span></div>
<div class="envelope" onclick="openLetter(1,this)"><span>💍 Propose</span></div>
<div class="envelope" onclick="openLetter(2,this)"><span>🍫 Chocolate</span></div>
<div class="envelope" onclick="openLetter(3,this)"><span>🧸 Teddy</span></div>
<div class="envelope" onclick="openLetter(4,this)"><span>🤝 Promise</span></div>
<div class="envelope" onclick="openLetter(5,this)"><span>🫂 Hug</span></div>
<div class="envelope" onclick="openLetter(6,this)"><span>💋 Kiss</span></div>
<div class="envelope" onclick="openLetter(7,this)"><span>💗 Valentine</span></div>
</div>
</div>

<div class="letter-screen" id="letterScreen">
<div id="letterText"></div>
<button class="back-btn" onclick="closeLetter()">Back 💗</button>
</div>

<script>

/* Floating 💗🌷 */
const container=document.querySelector(".floating-container");
const emojis=["💗","🌷"];
setInterval(()=>{
let span=document.createElement("span");
span.classList.add("float-item");
span.innerText=emojis[Math.floor(Math.random()*2)];
span.style.left=Math.random()*100+"vw";
span.style.animationDuration=(12+Math.random()*5)+"s";
container.appendChild(span);
setTimeout(()=>span.remove(),17000);
},1500);

/* No Button Runs */
const noBtn=document.getElementById("noBtn");
noBtn.addEventListener("mouseover",()=>{
noBtn.style.top=Math.random()*80+"vh";
noBtn.style.left=Math.random()*80+"vw";
});

/* Show Letters */
function showLetters(){
document.getElementById("intro").classList.add("hidden");
document.getElementById("lettersPage").classList.remove("hidden");
}

/* Typewriter */
function typeWriter(text){
let i=0;
let box=document.getElementById("letterText");
box.innerHTML="";
function typing(){
if(i<text.length){
box.innerHTML+=text.charAt(i);
i++;
setTimeout(typing,18);
}
}
typing();
}

/* Open */
function openLetter(index,el){
el.classList.add("open");
document.getElementById("letterScreen").style.display="flex";
typeWriter(letters[index]);
createSparkles();
}

/* Close */
function closeLetter(){
document.getElementById("letterScreen").style.display="none";
}

/* Sparkles */
function createSparkles(){
for(let i=0;i<15;i++){
let sp=document.createElement("div");
sp.classList.add("sparkle");
sp.innerText="✨";
sp.style.top=Math.random()*90+"%";
sp.style.left=Math.random()*90+"%";
document.getElementById("letterScreen").appendChild(sp);
setTimeout(()=>sp.remove(),2000);
}
}

</script>

</body>
  </html>
