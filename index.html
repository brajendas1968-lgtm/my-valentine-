<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Madam Jii 💗</title>

<style>
body{
  margin:0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg,#ff9ecf,#ffcce6,#ffd6eb);
  overflow-x:hidden;
}

/* Floating Background */
.floating-container{
  position:fixed;
  width:100%;
  height:100%;
  top:0;
  left:0;
  pointer-events:none;
  overflow:hidden;
  z-index:0;
}
.float-item{
  position:absolute;
  font-size:24px;
  opacity:0;
  animation:floatUp linear forwards;
}
@keyframes floatUp{
  0%{transform:translateY(100vh) scale(0.8);opacity:0;}
  20%{opacity:0.8;}
  100%{transform:translateY(-10vh) scale(1.2);opacity:0;}
}

/* Envelope Grid */
.container{
  position:relative;
  z-index:2;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  gap:20px;
  padding:30px;
}
.envelope{
  background:white;
  border-radius:15px;
  padding:20px;
  text-align:center;
  cursor:pointer;
  box-shadow:0 10px 25px rgba(0,0,0,0.1);
  transition:0.3s;
}
.envelope:hover{
  transform:scale(1.05);
}

/* Letter Screen */
.letter-screen{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:white;
  display:none;
  flex-direction:column;
  padding:30px;
  overflow-y:auto;
  z-index:5;
  animation:fadeIn 0.5s ease;
}
@keyframes fadeIn{
  from{opacity:0;}
  to{opacity:1;}
}

.letter-content{
  white-space:pre-line;
  font-size:18px;
  line-height:1.6;
  animation:type 3s steps(40,end);
}
@keyframes type{
  from{opacity:0;}
  to{opacity:1;}
}

.back-btn{
  margin-top:20px;
  padding:10px 20px;
  border:none;
  border-radius:20px;
  background:#ff4fa3;
  color:white;
  font-size:16px;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="floating-container"></div>

<div class="container">

<div class="envelope" onclick="openLetter(0)">🌷 Rose Day</div>
<div class="envelope" onclick="openLetter(1)">💍 Propose Day</div>
<div class="envelope" onclick="openLetter(2)">🍫 Chocolate Day</div>
<div class="envelope" onclick="openLetter(3)">🧸 Teddy Day</div>
<div class="envelope" onclick="openLetter(4)">🤝 Promise Day</div>
<div class="envelope" onclick="openLetter(5)">🫂 Hug Day</div>
<div class="envelope" onclick="openLetter(6)">💋 Kiss Day</div>
<div class="envelope" onclick="openLetter(7)">💗 Valentine</div>

</div>

<div class="letter-screen" id="letterScreen">
<div class="letter-content" id="letterText"></div>
<button class="back-btn" onclick="closeLetter()">Back 💗</button>
</div>

<script>

/* Floating Animation */
const container=document.querySelector(".floating-container");
const emojis=["💗","🌷"];
function createFloating(){
let span=document.createElement("span");
span.classList.add("float-item");
span.innerText=emojis[Math.floor(Math.random()*emojis.length)];
span.style.left=Math.random()*100+"vw";
span.style.animationDuration=(10+Math.random()*6)+"s";
container.appendChild(span);
setTimeout(()=>span.remove(),16000);
}
setInterval(createFloating,1500);

/* Messages */
const letters=[

`Cutiee Piee 🌷,

Tum kisi rose se kam nahi ho 💐
par farq bas itna hai…
rose sirf dekhne mein khoobsurat hota hai 🙂
aur tum mehsoos karne mein bhi 💗

Tumhari hasi na…
bilkul dil ko halka kar deti hai 🫀
jaise koi dheere se “sab theek hai” keh raha ho ❤️‍🩹

Rose Day par log phool dete hain 🤭
par main kya doon tumhe, Kolizaa 👉👈
tum toh meri zindagi ka sabse pyaara phool ho 🫶🌷`,

`Madam Jii 💗,

Jab tum haste ho na 🙂
toh lagta hai sab kuch sahi jagah par hai 🫀

Main perfect nahi hoon 👉👈
par tumhare saath rehna
bilkul perfect sa feel hota hai 🥰

Agar zindagi ek safar hai 🌷
toh main har mod par
sirf tumhara haath pakadna chahta hoon 🫂💗

Kya tum meri hamesha wali person banogi? 🫶💐`,

`Cutiee Piee 😋,

Chocolate dheere dheere melt hoti hai…
aur bilkul waise hi
tum mere dil mein ghul gayi ho 🫠💗

Tumhari ek chhoti si smile 🙂
mera pura din sweet bana deti hai 🌷

Meri zindagi ki sweetness
kab se tumhare naam hai 🫶💗`,

`Madam Jii 🥰,

Kabhi kabhi mann karta hai
tumhe ek tight sa hug doon 🫂💗
aur bas thodi der ke liye duniya bhool jaun 🙂

Tum meri comfort ho 🌷
mera sukoon ho 💗
mera sabse soft corner ho 👉👈🥰`,

`Kolizaa 🫀,

Main bada wada nahi karunga 🙄
par ek sachha promise karta hoon 💗

Jab tum udaas hogi 😭
main tumhe hasane ki koshish karunga 🙂

Aur chahe jo bhi ho
tumhara haath kabhi nahi chhodunga 🫶💐`,

`Cutiee Piee 🫂,

Ek hug mein bahut saari baatein hoti hain 💗
jo shabdon mein nahi aati 🙂

Tum meri woh jagah ho
jahan main bilkul real reh sakta hoon 👉👈💗`,

`Cutiee Piee 💋,

Kiss sirf ek moment nahi hota 💗
woh ek chhota sa ehsaas hota hai 🫀

Kabhi kabhi mann karta hai
tumhari gaal par ek pyara sa kiss rakh doon 😙
sirf taaki tum muskura do 🙂`,

`Madam Jii 💗,

Tumhara “maar khaoge” 🙄💗
tumhara “baat nhi karungi” 😉
ye meri favourite aadatein hain 🥰

Happy Valentine’s Day Kolizaa 💐
tum meri sabse pyaari aadat ho 🫶💗`

];

function openLetter(index){
document.getElementById("letterText").innerText=letters[index];
document.getElementById("letterScreen").style.display="flex";
}
function closeLetter(){
document.getElementById("letterScreen").style.display="none";
}

</script>

</body>
</html>
