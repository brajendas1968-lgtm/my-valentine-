<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Madam Jii 💖</title>

<style>
body{
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg,#ff9aa2,#fecfef);
    overflow-x:hidden;
    text-align:center;
}

/* Floating hearts */
.heart{
    position:fixed;
    bottom:-20px;
    font-size:20px;
    animation: float 6s linear infinite;
}
@keyframes float{
    0%{transform:translateY(0);}
    100%{transform:translateY(-100vh);}
}

.page{
    display:none;
    min-height:100vh;
    padding:40px 20px;
}
.active{
    display:block;
}

/* Buttons */
button{
    padding:12px 25px;
    font-size:18px;
    border:none;
    border-radius:25px;
    cursor:pointer;
    margin:10px;
}
#yesBtn{
    background:#ff2e63;
    color:white;
}
#noBtn{
    background:#eee;
}

/* Envelope Grid */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
    gap:20px;
    margin-top:30px;
}

/* Envelope */
.envelope{
    position:relative;
    height:120px;
    cursor:pointer;
}

.flap{
    position:absolute;
    width:100%;
    height:100%;
    background:#ff6f91;
    clip-path: polygon(0 0,100% 0,50% 50%);
    transition:0.6s;
    z-index:2;
}

.body{
    position:absolute;
    width:100%;
    height:100%;
    background:#fff;
    border:2px solid #ff6f91;
    border-radius:8px;
}

.card{
    display:none;
    margin-top:15px;
    padding:15px;
    background:rgba(255,255,255,0.9);
    border-radius:15px;
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

.open .flap{
    transform:rotateX(180deg);
}
.open + .card{
    display:block;
}

/* Glass effect title */
.title{
    font-size:26px;
    background:rgba(255,255,255,0.3);
    padding:15px;
    border-radius:20px;
    backdrop-filter: blur(10px);
}
</style>
</head>

<body>

<!-- PAGE 1 -->
<div class="page active" id="page1">
    <div class="title">
        Heyyy meri pyaari Madam Jiii 👀<br>
        Aapke liye ek surprise hai 🤭<br><br>
        Are you ready?
    </div>

    <button id="yesBtn" onclick="goNext()">Yes</button>
    <button id="noBtn" onclick="growYes()">No</button>
</div>

<!-- PAGE 2 -->
<div class="page" id="page2">
    <h2 class="title">💌 7 Days of Love 💖</h2>

    <div class="grid">

        <!-- 1 -->
        <div>
            <div class="envelope" onclick="toggle(this)">
                <div class="flap"></div>
                <div class="body"></div>
            </div>
            <div class="card">🌹 Rose Day Message Here</div>
        </div>

        <!-- 2 -->
        <div>
            <div class="envelope" onclick="toggle(this)">
                <div class="flap"></div>
                <div class="body"></div>
            </div>
            <div class="card">💍 Propose Day Message Here</div>
        </div>

        <!-- 3 -->
        <div>
            <div class="envelope" onclick="toggle(this)">
                <div class="flap"></div>
                <div class="body"></div>
            </div>
            <div class="card">🍫 Chocolate Day Message Here</div>
        </div>

        <!-- 4 -->
        <div>
            <div class="envelope" onclick="toggle(this)">
                <div class="flap"></div>
                <div class="body"></div>
            </div>
            <div class="card">🧸 Teddy Day Message Here</div>
        </div>

        <!-- 5 -->
        <div>
            <div class="envelope" onclick="toggle(this)">
                <div class="flap"></div>
                <div class="body"></div>
            </div>
            <div class="card">🤝 Promise Day Message Here</div>
        </div>

        <!-- 6 -->
        <div>
            <div class="envelope" onclick="toggle(this)">
                <div class="flap"></div>
                <div class="body"></div>
            </div>
            <div class="card">🤗 Hug Day Message Here</div>
        </div>

        <!-- 7 -->
        <div>
            <div class="envelope" onclick="toggle(this)">
                <div class="flap"></div>
                <div class="body"></div>
            </div>
            <div class="card">💋 Kiss Day / Valentine Message Here</div>
        </div>

    </div>
</div>

<script>
let size = 18;

function goNext(){
    document.getElementById("page1").classList.remove("active");
    document.getElementById("page2").classList.add("active");
}

function growYes(){
    size += 10;
    let yes = document.getElementById("yesBtn");
    yes.style.fontSize = size + "px";
    yes.style.padding = (size/1.2) + "px";
    if(size > 80){
        document.getElementById("noBtn").style.display="none";
    }
}

function toggle(el){
    el.classList.toggle("open");
}

/* Floating hearts generator */
setInterval(()=>{
    let heart = document.createElement("div");
    heart.className="heart";
    heart.innerHTML="💖";
    heart.style.left=Math.random()*100+"vw";
    heart.style.fontSize=(15+Math.random()*20)+"px";
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),6000);
},500);
</script>

</body>
</html>
