<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>For My Cutiee Piee 💗</title>

<style>
body{
margin:0;
font-family:'Segoe UI',cursive;
background:linear-gradient(135deg,#ff9ecb,#ffcce6);
overflow:hidden;
text-align:center;
color:white;
}

/* Floating 💗🌷 */
.floating{
position:fixed;
top:-50px;
font-size:24px;
animation:float 12s linear infinite;
opacity:0.7;
}
@keyframes float{
to{transform:translateY(110vh);}
}

/* Intro */
#intro{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
}
button{
padding:12px 25px;
border:none;
border-radius:25px;
font-size:18px;
cursor:pointer;
margin:10px;
transition:0.3s;
}
#yesBtn{background:#ff4da6;color:white;}
#noBtn{background:white;color:#ff4da6;}

/* Envelopes */
#envelopes{
display:none;
margin-top:80px;
}
.envelope{
width:120px;
height:80px;
background:white;
margin:15px auto;
border-radius:10px;
cursor:pointer;
position:relative;
transition:0.3s;
}
.envelope:before{
content:"💌";
font-size:30px;
position:absolute;
top:20px;
left:45px;
}

/* Message Page */
#messagePage{
display:none;
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:85%;
max-width:500px;
background:rgba(255,255,255,0.2);
backdrop-filter:blur(10px);
padding:25px;
border-radius:20px;
box-shadow:0 0 25px #fff;
animation:fadeIn 0.6s;
}

@keyframes fadeIn{
from{opacity:0;transform:translate(-50%,-60%);}
to{opacity:1;transform:translate(-50%,-50%);}
}

#text{
white-space:pre-line;
font-size:18px;
min-height:200px;
}

#backBtn{
margin-top:15px;
background:white;
color:#ff4da6;
}

.sparkle{
position:absolute;
width:6px;
height:6px;
background:white;
border-radius:50%;
animation:spark 1s infinite alternate;
}
@keyframes spark{
from{opacity:0.2;}
to{opacity:1;}
}

</style>
</head>
<body>

<div id="intro">
<h2>Will you open this, Madam Jii? 💗</h2>
<button id="yesBtn">Yes 💗</button>
<button id="noBtn">No 🙄</button>
</div>

<div id="envelopes"></div>

<div id="messagePage">
<div id="text"></div>
<button id="backBtn">Back 💌</button>
</div>

<script>

/* Floating hearts & flowers */
function createFloating(){
const symbols=["💗","🌷"];
let el=document.createElement("div");
el.className="floating";
el.innerHTML=symbols[Math.floor(Math.random()*2)];
el.style.left=Math.random()*100+"vw";
el.style.animationDuration=(8+Math.random()*5)+"s";
document.body.appendChild(el);
setTimeout(()=>el.remove(),12000);
}
setInterval(createFloating,800);

/* Yes No Logic */
let yes=document.getElementById("yesBtn");
let no=document.getElementById("noBtn");
let scale=1;
let taps=0;

no.onclick=function(){
taps++;
scale+=0.3;
yes.style.transform="scale("+scale+")";
if(taps>4){ no.style.display="none"; }
}

yes.onclick=function(){
document.getElementById("intro").style.display="none";
showEnvelopes();
}

/* Messages */
const messages=[
`1️⃣ Cutiee Piee 🌷,

Tum kisi rose se kam nahi ho 💐
par farq bas itna hai…
rose sirf dekhne mein khoobsurat hota hai 🙂
aur tum mehsoos karne mein bhi 💗

Tumhari hasi na…
bilkul dil ko halka kar deti hai 🫀
jaise koi dheere se “sab theek hai” keh raha ho ❤️‍🩹

Rose Day par log phool dete hain 🤭
par main kya doon tumhe, Kolizaa 👉👈
tum toh meri zindagi ka sabse pyaara phool ho 🫶🌷`,

`2️⃣ Madam Jii 💗,

Jab tum haste ho na 🙂
toh lagta hai sab kuch sahi jagah par hai 🫀

Main perfect nahi hoon 👉👈
par tumhare saath rehna
bilkul perfect sa feel hota hai 🥰

Agar zindagi ek safar hai 🌷
toh main har mod par
sirf tumhara haath pakadna chahta hoon 🫂💗

Is Propose Day par bas itna poochna hai… 😉
kya tum meri hamesha wali person banogi? 🫶💐`,

`3️⃣ Cutiee Piee 😋,

Chocolate dheere dheere melt hoti hai…
aur bilkul waise hi
tum mere dil mein ghul gayi ho 🫠💗

Tumhari ek chhoti si smile 🙂
mera pura din sweet bana deti hai 🌷

Jaise chocolate ka ek bite
mood better kar deta hai 😋
waise hi tumhara khayal
mera dil sambhaal leta hai 🫀❤️‍🩹

Sach kahun Kolizaa 🤭
meri zindagi ki sweetness
kab se tumhare naam hai 🫶💗`,

`4️⃣ Madam Jii 🥰,

Kabhi kabhi mann karta hai
tumhe ek tight sa hug doon 🫂💗
aur bas thodi der ke liye duniya bhool jaun 🙂

Tum meri comfort ho 🌷
mera sukoon ho 💗
aur mera sabse soft corner ho 👉👈🥰`,

`5️⃣ Kolizaa 🫀,

Main bada wada nahi karunga 🙄
par ek sachha promise zaroor karta hoon 💗

Jab tum udaas hogi 😭
main tumhe hasane ki puri koshish karunga 🙂

Jab tum thak jaogi ❤️‍🩹
main tumhara sahara banunga 🫂

Aur chahe jo bhi ho
tumhara haath kabhi nahi chhodunga 🫶💐`,

`6️⃣ Cutiee Piee 🫂,

Ek hug mein bahut saari baatein hoti hain 💗
jo shabdon mein nahi aati 🙂

Agar woh hug tumhara ho 🥰
toh duniya ka har stress halka lagta hai ❤️‍🩹

Aur tum…
tum meri woh jagah ho
jahan main bilkul real reh sakta hoon 👉👈💗`,

`7️⃣ Kiss Day 💋,

Cutiee Piee 💋,

Kiss sirf ek moment nahi hota 💗
woh ek chhota sa ehsaas hota hai
jo dil ko aur kareeb le aata hai 🫀

Kabhi kabhi mann karta hai
tumhari gaal par ek pyara sa kiss rakh doon 😙
sirf isliye
taaki tum muskura do 🙂

Tum meri sharam bhi ho 👉👈
aur meri himmat bhi 🫶

Aur har chhoti si nazdeeki
mere liye bahut special hai 🥰💗`,

`8️⃣ Madam Jii 💋,

Pyaar shor se nahi hota 💗
woh dheere dheere dil mein jagah bana leta hai 🌷

Tumhara “maar khaoge” 🙄💗
tumhara “baat nhi karungi” 😉
ye sab mere liye sirf dialogues nahi hain…
ye meri favourite aadatein hain 🥰

Tumhara nakhra bhi cute lagta hai 🤭
tumhara gussa bhi pyara lagta hai 🫀

Happy Valentine’s Day, Kolizaa 💐
tum meri sabse pyaari aadat ho 🥰💗`
];

/* Envelopes */
function showEnvelopes(){
let container=document.getElementById("envelopes");
container.style.display="block";
messages.forEach((m,i)=>{
let div=document.createElement("div");
div.className="envelope";
div.onclick=function(){openMessage(i);}
container.appendChild(div);
});
}

/* Typewriter */
function typeWriter(text){
let i=0;
let speed=30;
let box=document.getElementById("text");
box.innerHTML="";
function typing(){
if(i<text.length){
box.innerHTML+=text.charAt(i);
i++;
setTimeout(typing,speed);
}
}
typing();
}

/* Open Message */
function openMessage(index){
document.getElementById("envelopes").style.display="none";
document.getElementById("messagePage").style.display="block";
typeWriter(messages[index]);
}

/* Back */
document.getElementById("backBtn").onclick=function(){
document.getElementById("messagePage").style.display="none";
document.getElementById("envelopes").style.display="block";
}

</script>
</body>
</html>
